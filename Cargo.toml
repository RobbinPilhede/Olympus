[workspace]
resolver = "2"
members = ["crates/olympus-learn", "crates/olympus-core", "crates/olympus", "crates/olympus-node", "crates/olympus-obi"]
exclude = ["vendor/infr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
olympus-learn = { path = "crates/olympus-learn" }
olympus-core = { path = "crates/olympus-core" }
olympus-obi = { path = "crates/olympus-obi" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "process", "fs", "signal", "io-util", "io-std", "time"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "json", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
